# devices/shennong/device.conf: Xiaomi 14 Pro (shennong, SM8650 "pineapple").
# tools/hakios-device.py reads it; docs/porting/repositories.md has every word.
# Status reflects what the static HakiOS port now covers (drivers, addresses, firmware paths and
# UEFI/U-Boot are written for SM8650); `works` is reserved for what has been seen on the phone
# itself, so every part is `partial` (port written, hardware bring-up pending) until a run
# confirms it. Early bring-up reference: https://github.com/YX2748198202-lab/UniXNU-shennong

device shennong
	title       Xiaomi 14 Pro (23116PN5BC)
	vendor      Xiaomi
	soc         sm8650
	defconfig   shennong_defconfig
	firmware    pull-firmware.sh
	maintainer  ?
	status      display     partial   1440x3200 120 Hz LTPO through UEFI's framebuffer; GPU frames via ADRENO750 + Mesa (fb_beam/Metal chip table pending: hakios-metal refuses Adreno 750)
	status      touch       works     Synaptics S3910P TCM over SPI (SYNAPTICS, touchscreen=1): GPIO bit-bang TouchCom v1 (houji-style, no GENI), IOVDD ldob12 via RPMh v3 TCS; identify/app-info/descriptor/report-0x11 verified, taps+Moves reach backboardd (Settings opened by tap)
	status      buttons     works     power + volume through the PMIC arbiter (BUTTONS, buttons=1) with soc_arb_* from the tree; arbiter v7 (0x70010000, 896 APIDs, PON 0x013 APID 533, vol-up GPIO 0x18d APID 559); power/vol-up/vol-down presses verified into backboardd (wake + long-press tracked)
	status      cpu         works     8 cores, big core 7, EPSS top row (CPUFREQ, cpus=8 bootcpu=7 cpufreq=1) with soc_epss=0x17d91000; all 8 start and register, system boots to SpringBoard; GICR fix: loader maps the full bank (0x17180000/0x200000, stride 0x40000 from DT redistributor-stride) instead of the last frame (boot_final19.img)
	status      gpu         partial   Adreno 750 via ADRENO750 (gpu=1): GMU 0x3d68000, RSCC 0x3d50000, PDC 0xb280000, SM8650 GPUCC/GCC offsets; fw mapped (a750_gmu.bin, zap gen70900 split from odm); steps 1-5/8-10 pass (GPLL0 locked, CX on, rails gfx/cx/mx packed-voted via scanned TCS, SMMU 0x40000 layout, DTCM verified, zap INIT+MEM_SETUP+AUTH_AND_RESET ok); WALL (update 11-10): GMU dark-region mapping via adreno_gmuread (one word a run): DTCM 0x1c00 alive (0x32245f98), ITCM tail 0x1bff alive (0xa8593cc6), ITCM head 0x0c00 data-aborts (panic) - dark boundary inside ITCM; FAL/CM3 reads already proven abort; memnoc_gfx (0x9150) enable sticks w/o status (same hyp-gated pattern as gpucc_ahb/cxo_aon, no hang); fuse ANSWERED 11-10: TZ IS_CALL_AVAILABLE=1 and GPU_INIT_REGS returns 0 via step-2 probe (no hang) - TrustZone cooperates; WALL CLOSED 11-10: step 7 (RSCC) is the first GMU-adjacent touch and bus-wedges with zero log (adreno=10+skip 0x80 completes, 8-10 fine without it); readable: DTCM fully + ITCM tail word 0x1bff only (head 0x0c00/0x1000 data-abort); hanging: ITCM writes, FAL, CM3, RSCC, step 11+ MMIO; conclusion: SM8650 Gunyah XPU window policy, fixable only by hyp policy change; gpu_block_stop now withdraws rails + adreno_soak skips the 100 s hold; GX GDSC is VOTABLE with do-nothing power_on (upstream gpucc-sm8650: only GMU fw powers GX); direct GFX buck hangs, soc_gpu_vrm off; cross-checked vs UniXNU-ishtar-old SM8550/A740 (same Linux GMU sequence, no hyp workaround, GPU composites there): wall is SM8650-Gunyah policy, not sequence; system draws with software renderer
